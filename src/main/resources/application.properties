spring.application.name=PokemonManagementAPI

# Base H2 en mémoire
spring.datasource.url=jdbc:h2:mem:pokemondb
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crée les tables à partir des entités
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Exécute data.sql APRÈS la création des tables par Hibernate
spring.jpa.defer-datasource-initialization=true

# Un seul data.sql : celui de src/test/resources pendant les tests (prioritaire sur le classpath),
# sinon celui de src/main/resources
spring.sql.init.data-locations=classpath:data.sql

# Console web H2 : http://localhost:8080/h2-console
spring.h2.console.enabled=true
